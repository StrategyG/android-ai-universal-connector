[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "android-ai-universal-connector"
version = "0.1.0"
description = "Security-first MCP foundation for a modular Android AI universal connector."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0.1,<3.0.0",
  "httpx2>=2.0.0,<3.0.0",
  "pydantic>=2.0.0,<3.0.0",
  "starlette>=0.27.0,<2.0.0",
]

[project.scripts]
aic-connector = "aic_connector.server:main"
aic-gateway = "aic_connector.gateway:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
